name: Run Experiments

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  run-opts-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all dependencies (including Jupyter tools) from requirements.txt
          pip install -r requirements.txt

      - name: Run evoprompt-opts-ts.ipynb with secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  
        run: |
          # Execute all cells in the notebook and save output inplace
          jupyter nbconvert --to notebook --execute --inplace our-approach/ground-up/tos-context/run_experiments.ipynb