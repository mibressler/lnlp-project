name: Run EvoPrompt Manually

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  run-evoprompt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Adjust as needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run evoprompt-opts-ts.py with secret
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}  # Inject repository secret as environment variable
        run: |
          python our-approach/ground-up/evoprompt-opts-ts.py
